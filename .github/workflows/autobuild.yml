name: Autobuild (Windows) - Full Samples

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Android 工作负载 (Uno 构建所需)
        run: dotnet workload install android

      # ========== 修复后的 restore 步骤 ==========
      - name: 还原所有示例项目的依赖
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.sln -Recurse | ForEach-Object {
            Write-Host "正在还原: $($_.FullName)"
            dotnet restore $_.FullName
          }

      # ========== 编译所有解决方案（包括 ArchivedProjects） ==========
      - name: 编译所有 Windows 示例项目
        shell: pwsh
        run: |
          # 获取所有 .sln 文件（不排除任何目录）
          $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse
          foreach ($solution in $solutions) {
            Write-Host "正在编译: $($solution.FullName)"
            dotnet build $solution.FullName --configuration Release --no-restore
          }

      # ========== 收集所有编译产物（不过滤，全部复制） ==========
      - name: 收集所有编译产物
        shell: pwsh
        run: |
          $artifactsDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null

          $files = Get-ChildItem -Path .\**\bin\Release\** -Recurse -File
          foreach ($file in $files) {
            $relativePath = $file.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
            $dest = Join-Path $artifactsDir $relativePath
            $destDir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $dest -Force
          }
          Write-Host "共收集 $($files.Count) 个文件"

      - name: 打包所有产物为 ZIP 压缩包
        run: Compress-Archive -Path artifacts -DestinationPath build.zip -Force

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build.zip
          if-no-files-found: error
