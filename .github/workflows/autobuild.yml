name: Autobuild (Windows) - Full Samples

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write  # 创建 Release 必需

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 显示编译环境系统信息 (CMD)
        run: systeminfo
        shell: cmd

      - name: 安装 Android 工作负载 (部分项目需要)
        run: dotnet workload install android

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: 还原并编译所有 Windows 项目 (自动适配框架)
        continue-on-error: true
        shell: pwsh
        run: |
          $frameworks = @(
            "net10.0-windows",
            "net9.0-windows",
            "net8.0-windows",
            "net6.0-windows"
          )

          $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse

          foreach ($solution in $solutions) {
            $built = $false
            foreach ($fw in $frameworks) {
              Write-Host "========================================"
              Write-Host "尝试框架 $fw : $($solution.FullName)"
              Write-Host "----------------------------------------"

              Write-Host "还原 $fw ..."
              dotnet restore $solution.FullName -p:TargetFramework=$fw
              if ($LASTEXITCODE -ne 0) {
                Write-Host "还原失败，尝试下一个框架"
                continue
              }

              Write-Host "编译 $fw ..."
              dotnet build $solution.FullName --configuration Release --no-restore -p:TargetFramework=$fw
              if ($LASTEXITCODE -eq 0) {
                Write-Host "成功构建，框架: $fw"
                $built = $true
                break
              } else {
                Write-Host "编译失败，尝试下一个框架"
              }
            }

            if (-not $built) {
              Write-Host "跳过: $($solution.FullName)（所有框架均失败）"
            }
            Write-Host ""
          }

          Write-Host "所有解决方案处理完毕（部分可能失败，已被忽略）"

      - name: 收集所有编译产物 (排除 .pdb)
        shell: pwsh
        run: |
          $artifactsDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null

          $files = Get-ChildItem -Path . -Recurse -File | Where-Object {
              $_.DirectoryName -match '\\bin\\Release\\' -and $_.Extension -ne '.pdb'
          }

          if ($files.Count -eq 0) {
            Write-Host "未找到任何 bin\Release 下的文件，请检查构建是否成功。"
            exit 0
          }

          foreach ($file in $files) {
            $relativePath = $file.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
            $dest = Join-Path $artifactsDir $relativePath
            $destDir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $dest -Force
          }

          Write-Host "共收集 $($files.Count) 个文件"

      - name: 安装 7-Zip
        uses: milliewalky/setup-7-zip@v2
        with:
          tag: '24.07'

      - name: 7z 分卷压缩 (每卷 1.3 GB)
        run: |
          7z a -v1300m build.7z artifacts\*
        shell: cmd

      # ============================================================
      # 方式一：上传到 Artifacts (快速查看，链接有时效)
      # ============================================================
      - name: 上传分卷到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build-Artifacts
          path: build.7z.*
          if-no-files-found: error

      # ============================================================
      # 方式二：发布到 Release (永久链接，独立下载)
      # ============================================================
      - name: 生成 Release 标签
        id: tag
        shell: pwsh
        run: |
          $tag = "build-" + (Get-Date -Format "yyyyMMdd-HHmmss")
          Write-Host "Release 标签: $tag"
          Write-Host "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: 创建 Release 并上传分卷
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Windows Build ${{ steps.tag.outputs.tag }}"
          body: |
            ## Windows 平台编译产物

            - 编译时间: ${{ steps.tag.outputs.tag }}
            - 分卷大小: 1.3 GB
            - 总大小约 2.3 GB

            ### 下载后解压步骤
            1. 下载所有分卷文件 (build.7z.001, build.7z.002)
            2. 使用 7-Zip 打开 build.7z.001
            3. 解压到任意目录

            ### 提示
            - 如果 Artifact 下载超时，请使用本 Release 的独立下载链接
            - 每个分卷都有独立的永久下载链接
          files: |
            build.7z.*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
