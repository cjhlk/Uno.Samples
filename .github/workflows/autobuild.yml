name: Autobuild Windows Samples

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Android workload (required by some projects)
        run: dotnet workload install android

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore all project dependencies (skip workload resolution)
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter *.sln -Recurse | ForEach-Object {
            Write-Host "Restoring: $($_.FullName)"
            dotnet restore $_.FullName --skip-workload-resolution
          }

      - name: Build all Windows projects (auto-detect framework)
        continue-on-error: true
        shell: pwsh
        run: |
          $frameworks = @("net10.0-windows", "net9.0-windows", "net8.0-windows", "net6.0-windows")
          $solutions = Get-ChildItem -Path . -Filter *.sln -Recurse

          foreach ($solution in $solutions) {
            $built = $false
            foreach ($fw in $frameworks) {
              Write-Host "Trying framework $fw for: $($solution.FullName)"
              dotnet build $solution.FullName --configuration Release --no-restore -p:TargetFramework=$fw

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Build succeeded with framework: $fw"
                $built = $true
                break
              } else {
                Write-Host "Framework $fw failed, trying next"
              }
            }

            if (-not $built) {
              Write-Host "Warning: No suitable Windows framework found for $($solution.FullName), skipping"
            }
          }

          Write-Host "Build process completed (some projects may have failed and were ignored)"

      - name: Collect all build artifacts (no filtering)
        shell: pwsh
        run: |
          $artifactsDir = "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsDir | Out-Null

          $files = Get-ChildItem -Path .\**\bin\Release\** -Recurse -File

          foreach ($file in $files) {
            $relativePath = $file.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1)
            $dest = Join-Path $artifactsDir $relativePath
            $destDir = Split-Path $dest -Parent
            New-Item -ItemType Directory -Force -Path $destDir | Out-Null
            Copy-Item -Path $file.FullName -Destination $dest -Force
          }

          Write-Host "Collected $($files.Count) files"

      - name: Package all artifacts into ZIP
        run: Compress-Archive -Path artifacts -DestinationPath build.zip -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build.zip
          if-no-files-found: error
